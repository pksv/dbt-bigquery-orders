version: 2

models:
  - name: mart_monthly_revenue
    description: "Monthly revenue rollup with growth metrics"
    columns:
      - name: revenue_month
        data_tests:
          - not_null
          - unique
      - name: total_revenue
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000

  - name: mart_customer_lifetime_value
    description: "Customer lifetime value with segmentation"
    columns:
      - name: user_id
        data_tests:
          - unique
          - not_null
      - name: total_revenue
        data_tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 1000000

  - name: mart_product_performance
    description: "Product sales performance and inventory metrics"
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null
      - name: return_rate_pct
        data_tests:
          - dbt_expectations.expect_column_values_to_be_between:
              arguments:
                min_value: 0
                max_value: 100